INI file for Arrest Manager by Albo1125. Last updated for version 7.9.0.0.

[General]
//Set the following to either true or false.
AutoDoorShutEnabled=true


[Misc]
//Determines if transport officers speak. Can be 'True' or 'False'.
OfficerAudio=True

//Determines if dispatch audio is played for transport. Can be 'True' or 'False'.
DispatchAudio=True

//Determines whether nearby officers should be assigned the transport task if they're available instead of creating a new one.
AllowRecruitedOfficers=true

//Determines whether nearby officers are only recruited for the transport task if their model & vehicle complies with the settings below & in the XML file.
//E.g. if s_f_y_cop_01 is nearby in the countryside and this is set to true, a new transport unit is still created because it doesn't comply with the settings below (by default).
//For vehicles; only takes models into account, not liveries & extras. For customisation purists, it's best to turn recruited officers off.
RecruitedOfficerMustComplyWithStandards=true

//If using ELS vehicles, this must be set to false if you do not wish to have siren sounds due to limitations.
TransportSirenLightsEnabled=true

TransportSirenSoundsEnabled=false

//Determines whether transport or other services can automatically warp to you if they appear stuck. You can always force them to warp by holding the Transport/Scene Management keys.
AllowWarping=true

//Here you can change how far away the transport vehicle spawns in metres.
//Minimum is 50. Maximum is 250.
//Recruitable officers (See above) are considered 'near' if they're within 70% of the below range.
TransportSpawnDistance=85

//Here you can change how far away the Scene Management services spawn in metres.
//Minimum is 50. Maximum is 250
SceneManagementSpawnDistance=75

//Set a custom tow truck colour override here. Use valid names from this table: https://msdn.microsoft.com/en-us/library/system.drawing.color%28v=vs.110%29.aspx?f=255&MSPPError=-2147217396
//Leave blank to randomise.
TowTruckColourOverride=

//If true, nearby tow trucks that are free can be used to perform towing services.
RecruitNearbyTowTrucks=false

//Determines the vehicle model of the tow arm towtruck used. Make sure it is a tow truck model with a tow arm! This requires proper configuration by the vehicle author.
TowTruckModel=TOWTRUCK

//Determines the vehicle model of the flatbed tow truck - this should have sufficient space on the back, and not have a tow arm.
FlatbedModel=FLATBED

//Positional modifiers for vehicles to be placed on the flatbed properly. This may need tweaking for custom models.
FlatbedX=-0.5
FlatbedY=-5.75
FlatbedZ=1.005

//The flatbed is only used for destroyed four-wheel and all two-wheel vehicles by default, but you can set it to be used for all vehicles below (true/false).
AlwaysUseFlatbed=true

CoronerPedModel=S_M_M_DOCTOR_01

//The Coroner Vehicle Model must have at least 2 seats.
CoronerVehicleModel=SPEEDO


[Keybindings]
// Use the exact 'member name' for the corresponding 'key': https://msdn.microsoft.com/en-us/library/system.windows.forms.keys(v=vs.110).aspx
// If keys are invalid or unspecified, defaults will be set.
// Specifying 'None' disables the feature. 
// ModifierKeys need to be pressed to activate a feature. They can be set to None or any other valid key.

//Possible controller buttons: None, DPadLeft, DPadRight, DPadUp, DPadDown, X, Y, A, B, LeftThumb, RightThumb, LeftShoulder, RightShoulder, Back, Start

Transportkey=None
TransportModifierKey=None
JailRouteKey=D0
JailRouteModifierKey=None
ReleaseKey=D6
ReleaseModifierKey=None
SceneManagementKey=H

// You can set this to 'None' to disable it.
SceneManagementModifierKey=LControlKey
GrabPedKey=None
GrabPedModifierKey=None

//Allows you to place arrested peds you have grabbed in the back of a vehicle.
PlacePedInVehicleKey=G

TackleKey=None
TackleButton=None