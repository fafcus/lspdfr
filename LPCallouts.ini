[GENERAL]
; Available languages: english, german, chinese, italian & more, just add the translated files in a folder named with your language at plugins/LPCallouts/YOURLANGUAGE and type in the folder name here
Language=english

[UNIT]
//For the audiofiles Assorted Callouts by Ablo1125 are required
//Division can be set to any number from 01 to 10 inclusive. Default=01
Division=07
//UnitType can be set to any of the file names in the following folder: Grand Theft Auto V/LSPDFR/Police Scanner/Assorted Callouts Audio/UNIT_TYPE. Default=LINCOLN
UnitType=ADAM
//Beat can be set to any number from 01 to 24 inclusive. Default=18
Beat=12
//Jurisdiction -> Can be changed within the game with LPCallouts Menu
//Default=1
//Enter 1-6 for following departments:
//1 - LSPD Los Santos Police Department
//2 - LSSD Los Santos Sheriff Department
//3 - LSCS Los Santos County Sheriff
//4 - BCSO Blaine County Sheriff
//5 - SAHP San Andreas Highway Patrol
//6 - SAPR San Andreas Park Ranger
Department=2

[BACKUP_UNITS]
//Unit1
U1_Division=07
U1_UnitType=ADAM
U1_Beat=07
//Unit2
U2_Division=07
U2_UnitType=ADAM
U2_Beat=15

[KEYBINDING]
//Key for the conversations. Default=Y
//Possible Values: A-Z, 0-9
//
ActionKey=Y
//
//Key for LPCallouts Menu. Default=F11
//Possible Values: F1-F12
//
MenuKey=F11
//
//Modifier Key for LPCallouts Menu. Default=NONE
//Possible Values: LeftCtrl, RightCtrl, LeftAlt, RightAlt, LeftShift, RightShift, NONE
//
MenuModifier=NONE

[SCENE]
//Radius for Callouts to appear ( measured from player position )
//Possible values: 500-4000
//Default: 2000
SpawnRadius=2000
//
//Callout Probability. Default: 2 - Normal
//Possible Values: 1 - High, 2 - Normal, 3 - Low 
Occurrence=1

[EXTSUPPORT]
//Enable support for custom modes ( needed for RDE )
//0-disabled
//1-enabled
CustomModels=1
