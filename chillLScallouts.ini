  NeighborHarassment=true

  ; Security Alert - Investigate a silent sensor alarm at a freight facility
  SecurityAlert=true

  ; Pursuit Standoff - Take command after a pursuit ends in an armed vehicle standoff
  PursuitStandoff=true

  ; Vehicle Stopped on Shoulder - Check an occupied vehicle stopped on the shoulder
  VehicleStoppedOnShoulder=true

; Public Drinking - Two people drinking in public
