; ============================================================
;  chillLScallouts.ini - ChillLS Callouts by BB
;  Version: 1.5.2.3
; ============================================================
;  Lines starting with ; are comments
;  Key names: Y, N, End, Return, Space, F1-F12, D0-D9, etc.
;  Delete any line to keep the default value
; ============================================================


[Settings]
; Language for supported callouts and the Chill LS Callouts menu.
; Can also be changed in the Chill LS Callouts menu.
; Available: en, de, es, pt, br, ru, fr, pl, it, se, jp, tr
Language=es

; Name shown for the player in scripted dialogue subtitles.
; Leave empty to use the translated default name "Officer".
OfficerName=

; Quickly moves in-game time in smooth one-minute steps for callouts with a required time of day.
; The clock uses the shortest direction, including moving backward when that reaches the target sooner.
; Example: Courthouse Security Operation moves toward 10:00 after acceptance.
TimeAdaptiveCallouts=true

; Uses NPCAI for supported interviews instead of scripted NPC dialogue.
; Scene actions and some required interaction prompts remain scripted.
UseNPCAIWhenPossible=false

; Optional absolute maximum distance in meters for a callout to appear (0 = no additional limit)
; Example: 5000 = only callouts within 5km of the player will trigger
; Useful to keep callouts in a specific area (city only, or county only).
; When PreferNearbySpawns is enabled, PreferredCalloutDistance already acts as the local limit.
MaxCalloutDistance=0

; Restrict fixed callout scenes to the nearby radius below.
; If a callout has no valid nearby scene, it is declined instead of selecting a distant scene.
; Disable this only if you intentionally want random fixed scenes from across the map.
PreferNearbySpawns=true

; Allow fixed callout spawns from 100 meters away while avoiding scenes directly on the player.
MinCalloutDistance=100

; Local radius in meters used when PreferNearbySpawns is enabled.
; Fixed scenes beyond this distance are not offered.
PreferredCalloutDistance=1500

; Volume for ChillLS custom WAV playback that is handled by the plugin itself.
; 100 = full file volume, 50 = half volume, 0 = muted.
; The value is reloaded before each custom audio playback; restarting is not required.
; 0 also suppresses the related LSPDFR/RPH fallback scanner line.
CustomScannerAudioVolume=100

; Grace period after going on duty before ChillLS callouts are registered for ambient dispatch.
; Prevents an immediate callout while the player and other plugins are still loading.
; Allowed range: 0-600 seconds. Default: 5.
InitialCalloutDelaySeconds=5

; Number of seconds the player must manage traffic at crash and road-repair scenes.
; Allowed range: 20-600 seconds. Default: 80.
TrafficControlDurationSeconds=80

; Number of seconds the vehicle fire burns after the player establishes the lane closure.
; Applies only to the Fire Chief vehicle-fire scenario in Lane Closure.
; Allowed range: 10-600 seconds. Default: 60.
LaneClosureFireDurationSeconds=60

[Keys]
; Key to start dialogs / interact with NPCs
InteractKey=Y

; Key to finish and end a callout
EndKey=End

; Key to open the Chill LS Callouts manual callout menu
; Set to None to disable the menu completely
CalloutMenuKey=F5

; In-callout decision menus (Parking Dispute, Supervisor Traffic Stop, Taxi Driver
; Dispute) are navigated with the arrow keys and confirmed with Enter - no separate
; key config needed for these anymore.

[Menu]
; Patrol Mode is selected in the menu and starts in Default when the plugin loads.
; Default respects [Callouts] below; State Trooper enables its traffic/vehicle pool;
; Patrol Officer enables all current ChillLS calls. Neither override changes this INI.
; Reveals undiscovered Story Mode map areas by hiding the minimap fog of war.
; Can also be changed under Plugin Status, above Back, in the Chill LS Callouts menu.
RevealEntireMap=false

[Statistics]
; Enables local statistics tracking.
; Existing statistics are kept when this is set to false.
EnableStatistics=true


[Callouts]
