; Keys List english:    https://learn.microsoft.com/en-us/dotnet/api/system.windows.forms.keys?redirectedfrom=MSDN&view=windowsdesktop-6.0
; Tasten Liste deutsch: https://learn.microsoft.com/de-de/dotnet/api/system.windows.forms.keys?redirectedfrom=MSDN&view=windowsdesktop-6.0


[General]
; Languages: german, english, czech, thai, french, japanese, russian, italian, polish, spanish, vietnamese, portuguese, chinese, turkish, indonesian
Language = spanish

; the callout will change time to the recommended setting (Callouts: NoiseComplaint, Burglary, TropicalJustice, SolveMurder4, Manhunt)
RecommendedTime = true

; toggle AIVoices ingame, volume can be adjusted ingame if a voice is playing pressing CalloutMenuKey (J)
; a lot of callouts have AIVoice dialogues
EnableAIVoices = true

; enables Ultimate Backup vehicle & ped spawning, if EnableUB & EnablePR is false MCCallouts DefaultRegions will be used
EnableUB = false

; enables Policing Redefined vehicle & ped spawning, if EnableUB & EnablePR is false MCCallouts DefaultRegions will be used
; PR will be used over UB if both enabled
EnablePR = false



[Keybinds]
PrimaryKey = Y

; to disable the menu, set it to None or leave empty
MCMenuKey = F6

; if used, the MCMenu will only open if MCMenuModifier & MCMenuKey are pressed at the same time
MCMenuModifier = None

; with it you can skip longer flights or car trips, general cheat key for callouts
SkipKey = D9

; Menu key for callout settings
CalloutMenuKey = J

; if used, the Menu will only open if CalloutMenuKeyModifier & CalloutMenuKey are pressed at the same time
CalloutMenuKeyModifier = None
EndKey = End



